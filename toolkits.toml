# Optional toolkits that live in their own repositories and install into engine/toolkit/<name>.
# `repo` is a suggested source only: it is never required and never used at launch. Install from
# any repository or local folder with `paperboat toolkit install <name> --repo <url>` (or `--path`).
# `prefix` names the toolkit's example folders (`opt-01-…`, `ocv-01-…`); an installed toolkit's
# examples live in engine/toolkit/<name>/examples and are listed by `paperboat backends`.
[[toolkits]]
name = "optimization"
repo = "https://github.com/paperboatlab/paperboat-toolkit-optimization.git"
description = "Quadratic and linear programming blocks on OSQP."
optional = true
prefix = "opt"
engine = ">=0.1"
blocks = ["qp", "lp"]

[[toolkits]]
name = "control"
repo = "https://github.com/paperboatlab/paperboat-toolkit-control.git"
description = "Control blocks: pid, integrator, lag, delay, and per-step mpc, lp_step, nmpc (needs optimization)."
optional = true
engine = ">=0.1"
blocks = ["pid", "integrator", "lag", "delay", "mpc", "lp_step", "nmpc"]

[[toolkits]]
name = "opencv"
repo = "https://github.com/paperboatlab/paperboat-toolkit-opencv.git"
description = "Image processing blocks, view monitor, and image station object (OpenCV)."
optional = true
prefix = "ocv"
engine = ">=0.1"
blocks = ["gray", "blur", "median", "threshold", "adaptive_threshold", "hsv_range", "canny",
          "erode", "dilate", "open", "close", "invert", "distance",
          "resize", "crop", "flip", "rotate", "convert", "normalize", "equalize", "clahe",
          "sobel", "laplacian", "bitwise", "blend", "absdiff",
          "stats", "centroid", "contours", "hough_lines", "hough_circles", "template_match",
          "draw", "save", "background", "view", "image"]
