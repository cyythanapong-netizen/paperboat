notes = """Studio runs end to end on the real StudioApi: squero-om serves apps/studio/dist; library tree, acausal canvas, splice, split view (.mo and dry C++), Simulate, undo via shared undo.ts. Decisions and things B / the orchestrator should know:
- Server model: `paperboat squero [Model.mo]` opens that file (default ./Untitled.mo, created) through a new `open` op; the store saves (`save` op) after every edit and `generate` reads the saved file, so edits, save and the dry generate all go through one queue (a loadFile in generate would otherwise drop an unsaved edit).
- squero/0 ops added (squero.hpp): open, save, icon, set_icon, generate (dry, progress), simulate. Allow-list additions: isPartial, getSourceFile, getClassComment, getComponentModifierNames, getNthConnectionAnnotation, getParameterNames, getParameterValue, setParameterValue, setComponentProperties, updateComponent, updateConnection. save, simulate and addClassAnnotation are NOT on the allow-list: they are ops confined to the opened model (the MSL is refused).
- Bug found and fixed in the Wave 1 server: after a browser tab closed, every later client hung. gdb showed the client mutex owned by a thread that was itself waiting on it in the Close handler (the status push sends under that lock), so the lock is now recursive and the push walks a copy; the hang did not come back in the runs below.
- set_icon writes `g` and the plate size only (ports are component placements, not the icon); {param} text round-trips but always comes back mono. It round-trips all five Wave 2 goldens (test).
- For B: StudioApi.setParam("J", v) makes a missing top-level parameter as `Real J = v` (omc 1.27 answers false to setComponentProperties, so it is not yet `parameter`). addEntry works on a port path; on a variable it throws (a variable probe needs `annotation(__paperboat(probe=true))`, which addComponent cannot write); the words say so. `selection` holds part names; connect() returns the word message and never throws for a refused wire. exportBackend calls the non-dry generate on the saved file with the progress pushes.
- Placement: a part's placement is its plate centre in px on the 20px grid, 2px per Modelica unit, y flipped; rotation 0/90/180/270 and mirror are read and drawn (ports turn with the icon) but there is no rotate gesture yet. Wires are drawn with xyflow's smoothstep unless the .mo has Line(points) bends, which are kept (squared to the ports); Studio does not write bends itself.
- Shared (frozen) gaps, see [[requests]]: plate / port / wire / menu CSS lives in apps/web styles.css, so Studio copies it; connectError's word for output -> acausal reads "an output joins only an acausal port".
- Not done: moving a wire's bends, a rotate/mirror gesture, the Look tab / popover / dock bodies (B)."""
