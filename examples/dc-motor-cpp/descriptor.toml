# DCMotor as a Paperboat backend, generated by `paperboat modelica generate` from
# modelica/DCMotor.mo. Written once: edit it freely, generate leaves it alone.
# The DCMotor station object is domain/dc_motor.cpp (its props: the model's
# parameters and fixed starts); each one spawns a linked block on the Flow page.
domain = "dc-motor"
import = ["signal", "math", "control", "dashboard"]

[connectors.RealInput]
kind = "input"
handle = "triangle"
size = 8
weight = 1.2

[connectors.RealOutput]
kind = "output"
handle = "circle"
alt = "filled"
size = 8
weight = 1.2

# A model has no geometry of its own: the Station shows its objects as a graph.
[station]
view = "graph"
objects = [
  { id = "dc-motor-1", type = "dc-motor" },
]

# Default variables: the speed loop's setpoint and gains, tunable in the Variables sheet.
[[variables]]
name = "w_ref"
value = 1.5
unit = "rad/s"
group = "Speed loop"

[[variables]]
name = "kp"
value = 1
unit = "V·s/rad"
group = "Speed loop"

[[variables]]
name = "ki"
value = 4
unit = "V/rad"
group = "Speed loop"

# Starter: a PID holds the load's speed at w_ref; the armature voltage is its output.
[graph]
nodes = [
  { id = "dc-motor-1", type = "dc-motor", pos = [520, 0] },
  { id = "w-ref", type = "step", params = { at = 1, value = { var = "w_ref" } }, pos = [0, 0] },
  { id = "error", type = "sum", params = { signs = "+-" }, pos = [130, 0] },
  { id = "pid-w", type = "pid", params = { kp = { var = "kp" }, ki = { var = "ki" }, kd = 0 }, pos = [260, 0] },
  { id = "graph-w", type = "graph", pos = [780, 0] },
  { id = "graph-i", type = "graph", pos = [780, 120] },
  { id = "graph-v", type = "graph", pos = [520, 200] },
]
edges = [
  { from = ["w-ref", "y"], to = ["error", "a"] },
  { from = ["dc-motor-1", "w"], to = ["error", "b"] },
  { from = ["error", "y"], to = ["pid-w", "e"] },
  { from = ["pid-w", "u"], to = ["dc-motor-1", "v"] },
  { from = ["dc-motor-1", "w"], to = ["graph-w", "in"] },
  { from = ["dc-motor-1", "i"], to = ["graph-i", "in"] },
  { from = ["pid-w", "u"], to = ["graph-v", "in"] },
]
