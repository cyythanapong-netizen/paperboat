# Release packages: .deb, .rpm and .tar.gz (Linux), .tar.gz (macOS arm64), npm packages (@paperboatlabs/cli + one per platform), a GitHub release.
# A tag v<version> publishes; pull requests and manual runs only build and check the packages.
# The version is engine/CMakeLists.txt's project(paperboat VERSION ...); the tag must match it.
# Publishing to npm needs the NPM_TOKEN secret (an automation token for the @paperboat scope); without it
# the release is made and npm is skipped.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "npm/**"
      - "scripts/build_release.sh"
      - "scripts/pack_npm.py"
      - "engine/CMakeLists.txt"
      - "engine/cmake/**"
      - "engine/tests/sdk-backend/**"
      - "protocol/*.py"
      - "engine/core/**"
      - "engine/toolkit/**"
      - "engine/tools/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app and console (built once, for every package)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web app builds against the sibling paperboat-shared (file:../../../paperboat-shared).
      - name: paperboat-shared, next to this checkout
        env:
          TOKEN: ${{ secrets.DOWNSTREAM_TOKEN || github.token }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/paperboatlab/paperboat-shared.git" ../paperboat-shared
          (cd ../paperboat-shared && npm ci --no-audit --no-fund)
      - run: npm ci --no-audit --no-fund && npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: web-console
          path: |
            apps/web/dist
            apps/cli/bundle
          if-no-files-found: error

  linux:
    name: Linux (.deb, .rpm, .tar.gz, npm)
    needs: web
    runs-on: ubuntu-22.04  # glibc 2.35: the binary runs on Debian 12, Ubuntu 22.04+, Fedora, ...
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^project\(paperboat VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' engine/CMakeLists.txt)
          pre=$(sed -nE 's/^set\(PAPERBOAT_PRERELEASE "([^"]*)".*/\1/p' engine/CMakeLists.txt)
          v=$v${pre:+-$pre}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the CMake version $v"; exit 1
          fi
      # The web app and the console, built once (job web): plain JavaScript, the same on every OS.
      - uses: actions/download-artifact@v4
        with:
          name: web-console
          path: apps
      - run: sudo apt-get update && sudo apt-get install -y g++-12 ninja-build dpkg-dev rpm file
      - name: Build, test, package (.deb, .rpm, .tar.gz)
        run: CC=gcc-12 CXX=g++-12 WEB=OFF scripts/build_release.sh dist
      - name: npm packages
        run: |
          v=${{ steps.version.outputs.version }}
          cmake --install engine/build --prefix "$RUNNER_TEMP/root"   # the binary, share/ and the SDK
          python3 scripts/pack_npm.py --version "$v" --out dist/npm --target linux-x64 --prefix "$RUNNER_TEMP/root"
          python3 scripts/pack_npm.py --version "$v" --out dist/npm --main
      - name: The .deb installs on a clean Debian 12 and runs
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm sh -c '
            apt-get update -qq && apt-get install -y -qq /dist/paperboat_*.deb curl >/dev/null &&
            paperboat --version && paperboat pkg list && paperboat commands | grep -q pkg &&
            test -f /usr/share/paperboat/cli/main.js &&
            (paperboat start --port 3047 >/tmp/web.log 2>&1 &) && sleep 2 &&
            curl -sf http://localhost:3047/ | grep -q "<div id=\"root\"" && echo "web app served"'
      # The SDK (pb#177): with only the packages installed, a C++ backend builds and passes paperboat check.
      - name: "SDK: paperboat + paperboat-dev on Debian 12 build and check a backend"
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/engine/tests/sdk-backend:/src:ro" debian:bookworm sh -ec '
            apt-get update -qq && apt-get install -y -qq /dist/paperboat_*.deb /dist/paperboat-dev_*.deb python3-pip >/dev/null
            pip install -q --break-system-packages websockets jsonschema
            cp -r /src /tmp/sdk-backend && paperboat build /tmp/sdk-backend && paperboat check /tmp/sdk-backend'
      - name: "The .rpms on Fedora: install, run, and build and check a backend"
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/engine/tests/sdk-backend:/src:ro" fedora:latest sh -ec '
            dnf install -y -q /dist/paperboat-[0-9]*.rpm /dist/paperboat-devel-*.rpm python3-pip >/dev/null
            paperboat --version && paperboat pkg list && paperboat commands | grep -q pkg
            pip install -q websockets jsonschema
            cp -r /src /tmp/sdk-backend && paperboat build /tmp/sdk-backend && paperboat check /tmp/sdk-backend'
      - name: "SDK: the .tar.gz on Fedora builds and checks a backend"
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/engine/tests/sdk-backend:/src:ro" fedora:latest sh -ec '
            dnf install -y -q cmake gcc-c++ make python3-pip tar gzip >/dev/null
            pip install -q websockets jsonschema
            mkdir /opt/pb && tar xzf /dist/paperboat-*.tar.gz -C /opt/pb --strip-components=1
            cp -r /src /tmp/sdk-backend && /opt/pb/bin/paperboat build /tmp/sdk-backend && /opt/pb/bin/paperboat check /tmp/sdk-backend'
      - name: The npm packages install on a clean Node and run
        run: |
          prefix=$(mktemp -d)
          npm install -g --prefix "$prefix" dist/npm/paperboatlabs-cli-linux-x64-*.tgz dist/npm/paperboatlabs-cli-[0-9]*.tgz
          "$prefix/bin/paperboat" --version
          "$prefix/bin/paperboat" pkg list
          pip install -q --upgrade websockets jsonschema   # the runner's jsonschema 3.2 predates Draft 2020-12
          cp -r engine/tests/sdk-backend "$RUNNER_TEMP/sdk-backend" && cd "$RUNNER_TEMP"   # outside the checkout: the SDK, not the sources
          CXX=g++-12 "$prefix/bin/paperboat" build "$RUNNER_TEMP/sdk-backend"   # against the SDK in the platform package
          "$prefix/bin/paperboat" check "$RUNNER_TEMP/sdk-backend"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  macos:
    name: macOS arm64 (.tar.gz, npm)
    needs: web
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5  # a pip that may install (the system one is externally managed)
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^project\(paperboat VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' engine/CMakeLists.txt)
          pre=$(sed -nE 's/^set\(PAPERBOAT_PRERELEASE "([^"]*)".*/\1/p' engine/CMakeLists.txt)
          v=$v${pre:+-$pre}
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The web app and the console, built once (job web): plain JavaScript, the same on every OS.
      - uses: actions/download-artifact@v4
        with:
          name: web-console
          path: apps
      - run: brew list ninja >/dev/null 2>&1 || brew install ninja
      # libc++ is part of macOS, so no static runtime here; the binary runs on macOS 13 and later.
      - name: Build and test
        run: |
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DPAPERBOAT_BUILD_TESTS=ON
          cmake --build engine/build
          engine/build/tests/paperboat_tests
      - name: Package (.tar.gz, npm)
        run: |
          v=${{ steps.version.outputs.version }}
          (cd engine/build && cpack -G TGZ -B "$GITHUB_WORKSPACE/dist")
          cmake --install engine/build --prefix "$RUNNER_TEMP/root"
          python3 scripts/pack_npm.py --version "$v" --out dist/npm --target darwin-arm64 --prefix "$RUNNER_TEMP/root"
          python3 scripts/pack_npm.py --version "$v" --out dist/npm --main
      - name: The npm packages install on a clean Node, run, and build and check a backend
        run: |
          prefix=$(mktemp -d)
          npm install -g --prefix "$prefix" dist/npm/paperboatlabs-cli-darwin-arm64-*.tgz dist/npm/paperboatlabs-cli-[0-9]*.tgz
          "$prefix/bin/paperboat" --version
          "$prefix/bin/paperboat" pkg list
          pip install -q websockets jsonschema
          cp -r engine/tests/sdk-backend "$RUNNER_TEMP/sdk-backend" && cd "$RUNNER_TEMP"   # outside the checkout: the SDK, not the sources
          "$prefix/bin/paperboat" build "$RUNNER_TEMP/sdk-backend"   # against the SDK in the platform package
          "$prefix/bin/paperboat" check "$RUNNER_TEMP/sdk-backend"
          rm "$GITHUB_WORKSPACE"/dist/npm/paperboatlabs-cli-[0-9]*.tgz   # the launcher is published from the Linux job
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  windows:
    needs: web
    # ponytail: off until Windows is brought up again (the console and web app paths are in, untested there)
    if: false
    name: Windows (.zip, npm)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^project\(paperboat VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' engine/CMakeLists.txt)
          pre=$(sed -nE 's/^set\(PAPERBOAT_PRERELEASE "([^"]*)".*/\1/p' engine/CMakeLists.txt)
          v=$v${pre:+-$pre}
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The web app and the console, built once (job web): plain JavaScript, the same on every OS.
      - uses: actions/download-artifact@v4
        with:
          name: web-console
          path: apps
      # The CLI, the core and the toolkit, and of the
      # tests only the process layer's run here (engine/tests/process_test.cpp).
      - name: Build
        run: |
          cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64 \
            -DPAPERBOAT_STATIC_RUNTIME=ON -DPAPERBOAT_BUILD_TESTS=ON
          cmake --build engine/build --config Release --parallel
      - name: The process layer works (CreateProcess, pipes, job objects, kill)
        run: ctest --test-dir engine/build -C Release --output-on-failure
      - name: The binary runs
        run: |
          exe=engine/build/tools/Release/paperboat.exe
          "$exe" --version
          "$exe" commands | grep -q pkg
          "$exe" pkg versions squero-studio-om || true   # git over the pipe layer
          "$exe" < /dev/null                              # the prompt: its banner runs git through the process layer
      - name: Package (.zip, npm)
        run: |
          v=${{ steps.version.outputs.version }}
          (cd engine/build && cpack -G ZIP -C Release -B "$GITHUB_WORKSPACE/dist")
          cmake --install engine/build --config Release --prefix "$RUNNER_TEMP/root"
          python scripts/pack_npm.py --version "$v" --out dist/npm --target win32-x64 --prefix "$RUNNER_TEMP/root"
      - name: "SDK: the .zip builds and checks a backend"
        run: |
          v=${{ steps.version.outputs.version }}
          pip install -q websockets jsonschema
          mkdir -p "$RUNNER_TEMP/pb" && unzip -q dist/paperboat-*.zip -d "$RUNNER_TEMP/pb"
          exe=$(ls "$RUNNER_TEMP"/pb/*/bin/paperboat.exe)
          cp -r engine/tests/sdk-backend "$RUNNER_TEMP/sdk-backend" && cd "$RUNNER_TEMP"   # outside the checkout: the SDK, not the sources
          "$exe" build "$RUNNER_TEMP/sdk-backend"
          "$exe" check "$RUNNER_TEMP/sdk-backend"
          cd "$GITHUB_WORKSPACE" && python scripts/pack_npm.py --version "$v" --out dist/npm --main
      - name: The npm packages install and run through the launcher
        run: |
          prefix=$(mktemp -d)
          npm install -g --prefix "$prefix" dist/npm/paperboatlabs-cli-win32-x64-*.tgz dist/npm/paperboatlabs-cli-[0-9]*.tgz
          node "$prefix/node_modules/@paperboatlabs/cli/bin/paperboat.js" --version
          node "$prefix/node_modules/@paperboatlabs/cli/bin/paperboat.js" pkg list
          rm dist/npm/paperboatlabs-cli-[0-9]*.tgz   # the launcher is published from the Linux job
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  publish:
    name: Publish (tags only)
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write  # npm provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; esac   # v0.1.0-alpha.1
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $pre \
            dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.zip dist/npm/*.tgz
      - name: npm (platform packages first, the launcher last)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::NPM_TOKEN is not set; skipping npm"; exit 0; fi
          case "$GITHUB_REF_NAME" in *-*) tag=--tag=${GITHUB_REF_NAME#*-}; tag=${tag%%.*};; esac   # alpha.1 -> --tag alpha, never "latest"
          for f in dist/npm/paperboatlabs-cli-*-*.tgz dist/npm/paperboatlabs-cli-[0-9]*.tgz; do
            npm publish "$f" --access public --provenance $tag
          done
