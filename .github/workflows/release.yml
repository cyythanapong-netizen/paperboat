# Release packages on a GitHub release: the one-file paperboat (Linux x86_64, macOS arm64, Windows x64), which installs the rest
# on its first run; the .tar.gz it installs (and that scripts/install.sh downloads); the .zip (Windows x64); the
# Python wheels. scripts/install.sh and `paperboat update` download the .tar.gz; one format per platform, one update path (pb#357).
# Every package ships the Python bindings (pb#223) in lib/paperboat/python, so a Python backend runs
# with no pip step: paperboat._engine for CPython 3.11 and, through the stable ABI, for 3.12 and later
# (scripts/build_python.sh). The same builds' wheels (paperboat-*.whl) go to the release too.
# A tag v<version> publishes; pull requests and manual runs only build and check the packages.
# The version is engine/CMakeLists.txt's project(paperboat VERSION ...); the tag must match it.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "scripts/build_release.sh"
      - "scripts/install.sh"
      - "engine/CMakeLists.txt"
      - "engine/cmake/**"
      - "engine/tests/sdk-backend/**"
      - "engine/tests/sdk-backend-python/**"
      - "python/**"
      - "scripts/build_python.sh"
      - "protocol/*.py"
      - "engine/core/**"
      - "engine/toolkit/**"
      - "engine/tools/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app and console (built once, for every package)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web app builds against the sibling paperboat-shared (file:../../../paperboat-shared).
      - name: paperboat-shared, next to this checkout
        env:
          TOKEN: ${{ secrets.DOWNSTREAM_TOKEN || github.token }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/paperboatlab/paperboat-shared.git" ../paperboat-shared
          (cd ../paperboat-shared && npm ci --no-audit --no-fund)
      - run: npm ci --no-audit --no-fund && npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: web-console
          path: |
            apps/web/dist
            apps/cli/bundle
          if-no-files-found: error

  linux:
    name: Linux (.tar.gz)
    needs: web
    runs-on: ubuntu-22.04  # glibc 2.35: the binary runs on Debian 12, Ubuntu 22.04+, Fedora, ...
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Python bindings are built with both (scripts/build_python.sh); 3.12, set up last, is python3.
      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^project\(paperboat VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' engine/CMakeLists.txt)
          pre=$(sed -nE 's/^set\(PAPERBOAT_PRERELEASE "([^"]*)".*/\1/p' engine/CMakeLists.txt)
          v=$v${pre:+-$pre}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the CMake version $v"; exit 1
          fi
      # The web app and the console, built once (job web): plain JavaScript, the same on every OS.
      - uses: actions/download-artifact@v4
        with:
          name: web-console
          path: apps
      - run: sudo apt-get update && sudo apt-get install -y g++-12 ninja-build file
      - name: Build, test, package (.tar.gz, Python wheels)
        env:
          PYTHONS: ${{ steps.py311.outputs.python-path }} ${{ steps.py312.outputs.python-path }}
        run: CC=gcc-12 CXX=g++-12 WEB=OFF scripts/build_release.sh dist
      # The one file a user downloads (pb#358): paperboat with no shared libraries and a static libstdc++, so it
      # runs on its own. Its first run installs the runtime of its version (the .tar.gz) and hands over.
      - name: The one-file paperboat
        run: |
          CC=gcc-12 CXX=g++-12 cmake -S engine -B engine/build-standalone -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPAPERBOAT_SHARED_LIBS=OFF -DPAPERBOAT_STATIC_RUNTIME=ON -DPAPERBOAT_BUILD_TESTS=OFF
          cmake --build engine/build-standalone --target paperboat
          cp engine/build-standalone/tools/paperboat "dist/paperboat-${{ steps.version.outputs.version }}-Linux-x86_64"
      - name: The install tree, for the bundle check
        run: cmake --install engine/build --prefix "$RUNNER_TEMP/root"   # the binary, share/ and the SDK
      - name: No optional toolkit is bundled
        run: |
          python3 scripts/check_bundle.py --self-test
          python3 scripts/check_bundle.py --prefix "$RUNNER_TEMP/root"
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.whl)
          python3 scripts/check_bundle.py --archive "${archives[@]}"
      # The SDK (pb#177): with only the .tar.gz, a C++ backend builds and passes paperboat check.
      - name: "The .tar.gz on Debian 12: runs, serves the web app, builds and checks a backend, paperboat new writes, and checks a Python backend"
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/engine/tests/sdk-backend:/src:ro" \
              -v "$PWD/engine/tests/sdk-backend-python:/src-py:ro" debian:bookworm sh -ec '
            apt-get update -qq && apt-get install -y -qq cmake g++ make curl python3-pip >/dev/null
            pip install -q --break-system-packages websockets jsonschema
            mkdir /opt/pb && tar xzf /dist/paperboat-*.tar.gz -C /opt/pb --strip-components=1 && export PATH=/opt/pb/bin:$PATH
            paperboat --version && paperboat pkg list && paperboat commands | grep -q pkg
            test -f /opt/pb/share/paperboat/cli/main.js
            (paperboat start --port 3047 >/tmp/web.log 2>&1 &) && sleep 2
            curl -sf http://localhost:3047/ | grep -q "<div id=\"root\"" && echo "web app served"
            cp -r /src /tmp/sdk-backend && paperboat build /tmp/sdk-backend && paperboat check /tmp/sdk-backend
            cd /tmp && paperboat new demo && paperboat build demo && paperboat check demo
            python3 --version && cp -r /src-py /tmp/py-backend && paperboat check /tmp/py-backend'
      - name: "SDK: the .tar.gz on Fedora builds and checks a backend, and checks a Python backend"
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/engine/tests/sdk-backend:/src:ro" \
              -v "$PWD/engine/tests/sdk-backend-python:/src-py:ro" fedora:latest sh -ec '
            dnf install -y -q cmake gcc-c++ make python3-pip tar gzip git >/dev/null
            pip install -q websockets jsonschema
            mkdir /opt/pb && tar xzf /dist/paperboat-*.tar.gz -C /opt/pb --strip-components=1
            cp -r /src /tmp/sdk-backend && /opt/pb/bin/paperboat build /tmp/sdk-backend && /opt/pb/bin/paperboat check /tmp/sdk-backend
            cp -r /src-py /tmp/py-backend && cd /tmp && /opt/pb/bin/paperboat check /tmp/py-backend'
      # The promise (pb#358): one install, then paperboat manages the rest. On a clean machine with only the
      # usual tools: install.sh puts paperboat in ~/.local, and from there a toolkit (built as a plugin
      # against the SDK, no engine rebuild), its example, a library app and the update check.
      - name: "One file: the downloaded paperboat installs itself, then installs a toolkit, checks its example, installs an app, checks for updates"
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -ec '
            dnf install -y -q cmake gcc-c++ make git tar gzip curl nodejs npm python3-pip >/dev/null
            pip install -q websockets jsonschema
            cp /dist/paperboat-*-Linux-x86_64 /tmp/paperboat && chmod +x /tmp/paperboat && cd /tmp
            # PAPERBOAT_ARCHIVE: this build'"'"'s .tar.gz, as the release does not exist yet (a user downloads it)
            PAPERBOAT_ARCHIVE=$(ls /dist/paperboat-*-Linux-x86_64.tar.gz) /tmp/paperboat --version
            PAPERBOAT_ARCHIVE=$(ls /dist/paperboat-*-Linux-x86_64.tar.gz) /tmp/paperboat pkg list
            export PATH="$HOME/.local/bin:$PATH"
            paperboat --version
            paperboat toolkit install optimization
            paperboat toolkit list optimization | grep -q "optimization/qp"
            paperboat check opt-01
            paperboat pkg install paperboat-shared
            paperboat pkg list | grep paperboat-shared | grep -vq "not installed"
            paperboat update --check'
      - name: "The wheel installs with pip and runs a Python backend"
        run: |
          python -m venv "$RUNNER_TEMP/whl" && "$RUNNER_TEMP/whl/bin/pip" install -q dist/paperboat-*-cp312-abi3-*.whl
          cp -r engine/tests/sdk-backend-python "$RUNNER_TEMP/whl-backend" && cd "$RUNNER_TEMP/whl-backend"
          "$RUNNER_TEMP/whl/bin/python" server.py --run | tail -1 | grep -q '"status":"done"' && echo "wheel runs"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  macos:
    name: macOS arm64 (.tar.gz)
    # macOS runners cost about ten Linux minutes and run in parallel, so they are checked on
    # pushes to dev and main; label a PR `ci:macos` to run them before merging.
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A pip that may install (the system one is externally managed), and the two Pythons the bindings
      # are built with (scripts/build_python.sh); 3.12, set up last, is python3.
      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^project\(paperboat VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' engine/CMakeLists.txt)
          pre=$(sed -nE 's/^set\(PAPERBOAT_PRERELEASE "([^"]*)".*/\1/p' engine/CMakeLists.txt)
          v=$v${pre:+-$pre}
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The web app and the console, built once (job web): plain JavaScript, the same on every OS.
      - uses: actions/download-artifact@v4
        with:
          name: web-console
          path: apps
      - run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Python bindings (wheels, and the modules the packages ship)
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          scripts/build_python.sh engine/build/python "${{ steps.py311.outputs.python-path }}" "${{ steps.py312.outputs.python-path }}"
          mkdir -p dist && cp engine/build/python/wheels/*.whl dist/
      # libc++ is part of macOS, so no static runtime here; the binary runs on macOS 13 and later.
      - name: Build and test
        run: |
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DPAPERBOAT_BUILD_TESTS=ON \
            -DPAPERBOAT_PYTHON_MODULES_DIR="$PWD/engine/build/python/modules"
          cmake --build engine/build
          engine/build/tests/paperboat_tests
      - name: Package (.tar.gz, and the one-file paperboat)
        run: |
          (cd engine/build && cpack -G TGZ -B "$GITHUB_WORKSPACE/dist")
          cmake --install engine/build --prefix "$RUNNER_TEMP/root"
          cmake -S engine -B engine/build-standalone -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DPAPERBOAT_SHARED_LIBS=OFF -DPAPERBOAT_BUILD_TESTS=OFF
          cmake --build engine/build-standalone --target paperboat
          cp engine/build-standalone/tools/paperboat "dist/paperboat-${{ steps.version.outputs.version }}-Darwin-arm64"
      - name: The one-file paperboat installs itself and runs
        run: |
          cd "$RUNNER_TEMP"
          export PAPERBOAT_HOME="$RUNNER_TEMP/one/home" PAPERBOAT_BIN="$RUNNER_TEMP/one/bin"
          # As a download: outside the checkout, which the binary would otherwise find and act as its binary.
          cp "$GITHUB_WORKSPACE"/dist/paperboat-*-Darwin-arm64 "$RUNNER_TEMP/paperboat"
          PAPERBOAT_ARCHIVE=$(ls "$GITHUB_WORKSPACE"/dist/paperboat-*-Darwin-arm64.tar.gz) "$RUNNER_TEMP/paperboat" pkg list
          "$PAPERBOAT_BIN/paperboat" --version
      - name: No optional toolkit is bundled
        run: |
          python3 scripts/check_bundle.py --self-test
          python3 scripts/check_bundle.py --prefix "$RUNNER_TEMP/root"
          python3 scripts/check_bundle.py --archive dist/*.tar.gz
      - name: The .tar.gz runs, and builds and checks a backend
        run: |
          mkdir -p "$RUNNER_TEMP/pb" && tar xzf dist/paperboat-*.tar.gz -C "$RUNNER_TEMP/pb" --strip-components=1
          "$RUNNER_TEMP/pb/bin/paperboat" --version
          "$RUNNER_TEMP/pb/bin/paperboat" pkg list
          pip install -q websockets jsonschema
          cp -r engine/tests/sdk-backend "$RUNNER_TEMP/sdk-backend" && cd "$RUNNER_TEMP"   # outside the checkout: the SDK, not the sources
          "$RUNNER_TEMP/pb/bin/paperboat" build "$RUNNER_TEMP/sdk-backend"
          "$RUNNER_TEMP/pb/bin/paperboat" check "$RUNNER_TEMP/sdk-backend"
          cp -r "$GITHUB_WORKSPACE/engine/tests/sdk-backend-python" "$RUNNER_TEMP/py-backend"
          "$RUNNER_TEMP/pb/bin/paperboat" check "$RUNNER_TEMP/py-backend"   # python3 3.12: the abi3 module
      - name: "The .tar.gz checks a Python backend with Python 3.11 (PAPERBOAT_PYTHON: the cp311 module)"
        run: |
          py311="${{ steps.py311.outputs.python-path }}"
          "$py311" -m pip install -q websockets jsonschema
          cp -r engine/tests/sdk-backend-python "$RUNNER_TEMP/py-backend-311" && cd "$RUNNER_TEMP"
          PAPERBOAT_PYTHON="$py311" "$RUNNER_TEMP/pb/bin/paperboat" check "$RUNNER_TEMP/py-backend-311"
      - name: The web app is served from the .tar.gz, and stops
        run: |
          "$RUNNER_TEMP/pb/bin/paperboat" start --daemon --port 3047
          curl -sf --retry 15 --retry-connrefused --retry-delay 1 http://localhost:3047/ | grep -q '<div id="root"' && echo "web app served"
          "$RUNNER_TEMP/pb/bin/paperboat" list
          "$RUNNER_TEMP/pb/bin/paperboat" stop
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  windows:
    needs: web
    name: Windows (.zip)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Python bindings are built with both (scripts/build_python.sh); 3.12, set up last, is on PATH.
      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^project\(paperboat VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' engine/CMakeLists.txt)
          pre=$(sed -nE 's/^set\(PAPERBOAT_PRERELEASE "([^"]*)".*/\1/p' engine/CMakeLists.txt)
          v=$v${pre:+-$pre}
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The web app and the console, built once (job web): plain JavaScript, the same on every OS.
      - uses: actions/download-artifact@v4
        with:
          name: web-console
          path: apps
      # The static C runtime, as paperboat.exe: Python ships vcruntime140.dll but not msvcp140.dll.
      - name: Python bindings (wheels, and the modules the packages ship)
        env:
          CMAKE_ARGS: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        run: |
          scripts/build_python.sh engine/build/python "${{ steps.py311.outputs.python-path }}" "${{ steps.py312.outputs.python-path }}"
          mkdir -p dist && cp engine/build/python/wheels/*.whl dist/
      # The CLI, the core and the toolkit, and of the
      # tests only the process layer's run here (engine/tests/process_test.cpp).
      - name: Build
        run: |
          cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64 \
            -DPAPERBOAT_STATIC_RUNTIME=ON -DPAPERBOAT_BUILD_TESTS=ON \
            -DPAPERBOAT_PYTHON_MODULES_DIR="$(cygpath -m "$PWD/engine/build/python/modules")"
          cmake --build engine/build --config Release --parallel
      - name: The process layer works (CreateProcess, pipes, job objects, kill)
        run: ctest --test-dir engine/build -C Release --output-on-failure
      - name: The binary runs
        run: |
          exe=engine/build/tools/Release/paperboat.exe
          "$exe" --version
          "$exe" commands | grep -q pkg
          "$exe" pkg versions squero-studio-om || true   # git over the pipe layer
          "$exe" < /dev/null                              # the prompt: its banner runs git through the process layer
      - name: Package (.zip, and the one-file paperboat.exe)
        run: |
          (cd engine/build && cpack -G ZIP -C Release -B "$GITHUB_WORKSPACE/dist")
          cmake --install engine/build --config Release --prefix "$RUNNER_TEMP/root"
          # The Windows build is static already (no shared libraries, the static MSVC runtime): its exe is the one file.
          cp engine/build/tools/Release/paperboat.exe "dist/paperboat-${{ steps.version.outputs.version }}-Windows-AMD64.exe"
      - name: The one-file paperboat.exe installs itself and runs
        run: |
          cd "$RUNNER_TEMP"
          one="$RUNNER_TEMP/one"   # Windows paths for PowerShell (install.ps1), POSIX ones for this shell
          export PAPERBOAT_HOME=$(cygpath -w "$one/home") PAPERBOAT_BIN=$(cygpath -w "$one/bin")
          # As a download: outside the checkout, which the exe would otherwise find and act as its binary.
          cp "$GITHUB_WORKSPACE"/dist/paperboat-*-Windows-AMD64.exe "$RUNNER_TEMP/paperboat.exe"
          PAPERBOAT_ARCHIVE=$(cygpath -w "$(ls "$GITHUB_WORKSPACE"/dist/paperboat-*.zip)") "$RUNNER_TEMP/paperboat.exe" pkg list
          exe=$(ls "$one"/home/self/*/bin/paperboat.exe)
          "$exe" --version
          "$exe" update --check
      - name: No optional toolkit is bundled
        run: |
          python scripts/check_bundle.py --self-test
          python scripts/check_bundle.py --prefix "$RUNNER_TEMP/root"
          python scripts/check_bundle.py --archive dist/*.zip dist/*.whl
      - name: "SDK: the .zip builds and checks a backend"
        run: |
          pip install -q websockets jsonschema
          mkdir -p "$RUNNER_TEMP/pb" && unzip -q dist/paperboat-*.zip -d "$RUNNER_TEMP/pb"
          exe=$(ls "$RUNNER_TEMP"/pb/*/bin/paperboat.exe)
          cp -r engine/tests/sdk-backend "$RUNNER_TEMP/sdk-backend" && cd "$RUNNER_TEMP"   # outside the checkout: the SDK, not the sources
          "$exe" build "$RUNNER_TEMP/sdk-backend"
          "$exe" check "$RUNNER_TEMP/sdk-backend"
          cp -r "$GITHUB_WORKSPACE/engine/tests/sdk-backend-python" "$RUNNER_TEMP/py-backend"
          "$exe" check "$RUNNER_TEMP/py-backend"   # Python 3.12: the abi3 module (_engine.pyd)
          py311="${{ steps.py311.outputs.python-path }}"
          "$py311" -m pip install -q websockets jsonschema
          PAPERBOAT_PYTHON="$py311" "$exe" check "$RUNNER_TEMP/py-backend"   # the cp311 module
      - name: The web app is served from the .zip, and stops
        run: |
          exe=$(ls "$RUNNER_TEMP"/pb/*/bin/paperboat.exe)
          "$exe" start --daemon --port 3047
          curl -sf --retry 15 --retry-connrefused --retry-delay 1 http://localhost:3047/ | grep -q '<div id="root"' && echo "web app served"
          "$exe" list
          "$exe" stop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  publish:
    name: Publish (tags only)
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; esac   # v0.1.0-alpha.1
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $pre \
            dist/*.tar.gz dist/*.zip dist/*.whl dist/paperboat-*-Linux-x86_64 dist/paperboat-*-Darwin-arm64 dist/paperboat-*-Windows-AMD64.exe
