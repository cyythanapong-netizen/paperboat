# The engine and its tests (C++). One workflow per check, so each has its own README badge.
name: engine

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (C++ build and tests, SUNDIALS ${{ matrix.sundials }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sundials: ["ON", "OFF"]  # OFF compiles the implicit solvers out (`unknown solver`, not a missing symbol)
    env:
      CXX: g++-14
      CC: gcc-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPAPERBOAT_BUILD_TESTS=ON -DPAPERBOAT_WITH_SUNDIALS=${{ matrix.sundials }}
      - name: Build
        run: cmake --build engine/build
      - name: Test
        run: ctest --test-dir engine/build --output-on-failure

