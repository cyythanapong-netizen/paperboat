# The engine and its tests (C++). One workflow per check, so each has its own README badge.
name: engine

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (C++ build and tests)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
      CC: gcc-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPAPERBOAT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build engine/build
      - name: Test
        run: ctest --test-dir engine/build --output-on-failure


  engine-macos:
    name: Engine on macOS arm64 (C++ build and tests)
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - name: Configure
        run: cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPAPERBOAT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build engine/build
      - name: Test
        run: ctest --test-dir engine/build --output-on-failure
