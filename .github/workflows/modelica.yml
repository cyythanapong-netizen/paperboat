# OpenModelica integration tests: C++ omc bridge, squero/0 server, and generated backend goldens.
#
# The Studio app itself lives in the squero-studio-om repo; this covers the engine side of it.
name: modelica

on:
  push:
    branches: [dev, main]
    paths:
      - "engine/modelica/**"
      - "examples/dc-drive-cpp/**"
      - ".github/workflows/modelica.yml"
  pull_request:
    paths:
      - "engine/modelica/**"
      - "examples/dc-drive-cpp/**"
      - ".github/workflows/modelica.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modelica:
    name: OpenModelica (bridge, squero/0, and golden)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
      CC: gcc-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenModelica MSL
        id: cache-msl
        uses: actions/cache@v4
        with:
          path: ~/.openmodelica
          key: openmodelica-msl-${{ runner.os }}

      - name: Install OpenModelica from official apt repo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg ninja-build
          curl -fsSL https://build.openmodelica.org/apt/openmodelica.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/openmodelica-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/openmodelica-keyring.gpg] https://build.openmodelica.org/apt $(lsb_release -cs) stable" | \
            sudo tee /etc/apt/sources.list.d/openmodelica.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmodelica omc
          omc --version

      - name: Preload Modelica Standard Library
        if: steps.cache-msl.outputs.cache-hit != 'true'
        run: |
          # OpenModelica 1.27 has no apt package for the library; its package manager installs it (the goldens are 4.1.0).
          printf 'installPackage(Modelica, "4.1.0+maint.om", exactMatch=true);\nloadModel(Modelica);\ngetErrorString();\n' > preload.mos
          omc preload.mos

      - name: Configure
        run: cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPAPERBOAT_BUILD_TESTS=ON -DPAPERBOAT_BUILD_MODELICA=ON

      - name: Build
        run: cmake --build engine/build

      - name: Test bridge and squero/0
        run: engine/build/tests/paperboat_tests '[modelica],[squero]'

      - name: Python modules for the smoke stage
        run: pip install websockets jsonschema

      - name: The generated dc-drive backend builds and passes check (manifest, catalog, smoke, golden)
        run: engine/build/tools/paperboat check examples/dc-drive-cpp
