{%- extends "basic/layout.html" %}
{# The theme is set before the page paints, so a chosen light or dark does not flash. #}
{%- block extrahead %}
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("paperboat.docs.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
{{ super() }}
{%- endblock %}
